name: InhalerCount
options:
  bundleIdPrefix: com.shimondeitel.inhalercount
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  InhalerCount:
    type: application
    platform: iOS
    sources:
      - path: InhalerCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.inhalercount
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: InhalerCount/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  InhalerCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InhalerCountTests
      - path: InhalerCount.storekit
    dependencies:
      - target: InhalerCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.inhalercount.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  InhalerCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InhalerCountUITests
    dependencies:
      - target: InhalerCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.inhalercount.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  InhalerCount:
    build:
      targets:
        InhalerCount: all
        InhalerCountTests: [test]
        InhalerCountUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: InhalerCount.storekit
    test:
      config: Debug
      storeKitConfiguration: InhalerCount.storekit
      targets:
        - InhalerCountTests
        - InhalerCountUITests
    archive:
      config: Release
